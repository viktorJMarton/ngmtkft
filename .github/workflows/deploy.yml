name: Manual legacy GitHub Pages deployment
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: 'true'
      - run: npm run test:consent
        env:
          CI: 'true'
      - run: npm run build
        env:
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_ANALYTICS_APPROVED: ${{ vars.VITE_ANALYTICS_APPROVED }}
      - run: npm run check:seo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
